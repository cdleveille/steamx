name: cicd

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  cicd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - run: go vet -C src ./...
      - run: CGO_ENABLED=0 go build -C src -trimpath -ldflags="-s -w" -o ../dist/steamx .
